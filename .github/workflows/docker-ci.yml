name: Docker CI

on:
  push:
    branches:
      - main
      - develop
      - master
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    branches:
      - main
      - develop
      - master
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-ci.yml'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build-and-test:
    name: Docker Build & Compose Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Prepare Environment File
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=sqlite/' .env

      - name: Build and Start Stack via Docker Compose
        run: |
          docker compose up -d --build

      - name: Wait for Container Health
        run: |
          echo "Waiting for container to become healthy..."
          timeout=90
          elapsed=0
          until [ "$elapsed" -ge "$timeout" ]; do
            status=$(docker inspect --format='{{json .State.Health.Status}}' koamistarterkit-app 2>/dev/null || echo '"unhealthy"')
            echo "Current health status: $status (elapsed: ${elapsed}s)"
            if [ "$status" = '"healthy"' ]; then
              echo "Container is healthy!"
              break
            fi
            sleep 3
            elapsed=$((elapsed + 3))
          done

          if [ "$elapsed" -ge "$timeout" ]; then
            echo "Timed out waiting for container health."
            docker compose logs
            exit 1
          fi

      - name: Verify Application HTTP Endpoints
        run: |
          echo "Checking /up endpoint..."
          curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8000/up

          echo "Checking /login endpoint..."
          curl -I --fail --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8000/login

      - name: Verify In-Container Migrations & Status
        run: |
          docker compose exec -T app php artisan migrate:status
          docker compose exec -T app php artisan octane:status

      - name: Tear Down Stack
        if: always()
        run: |
          docker compose down -v
